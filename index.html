<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2774AE">
  <meta name="description" content="Interval is developing a clinician-guided rehabilitation experience. Beta coming soon.">
  <title>Interval — Beta Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&family=Allura&display=swap" rel="stylesheet">
  <style>
    :root { --blue:#2774AE; --navy:#102746; --gold:#FFD100; --pale:#F4F7FA; --muted:#587087; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; font-family:'DM Sans', system-ui, sans-serif; background:var(--pale); color:var(--navy); }
    .page { min-height:100svh; display:flex; flex-direction:column; }
    header { display:flex; align-items:center; justify-content:space-between; padding:28px clamp(24px,6vw,100px); }
    .brand { font-size:26px; font-weight:700; letter-spacing:-1.2px; }
    .brand span { color:var(--blue); }
    .header-note { color:var(--muted); font-size:12px; letter-spacing:.13em; text-transform:uppercase; font-weight:700; }
    main { flex:1; display:grid; place-items:center; padding:14px clamp(18px,4vw,64px) 38px; }
    .hero { position:relative; isolation:isolate; overflow:hidden; width:min(100%,1120px); min-height:540px; border-radius:24px; background:var(--blue); color:white; display:flex; align-items:center; justify-content:center; text-align:center; padding:75px 28px 80px; box-shadow:0 22px 65px rgba(16,39,70,.09); }
    .hero::before { content:""; position:absolute; width:490px; height:490px; border:1px solid rgba(255,255,255,.13); border-radius:50%; right:-195px; top:-240px; z-index:-1; }
    .hero::after { content:""; position:absolute; width:430px; height:430px; border:1px solid rgba(255,255,255,.11); border-radius:50%; left:-270px; bottom:-275px; z-index:-1; }
    .inner { max-width:850px; animation:enter .8s ease-out both; }
    .eyebrow { text-transform:uppercase; letter-spacing:.22em; font-weight:700; font-size:12px; }
    .gold-line { height:4px; width:55px; margin:22px auto 28px; background:var(--gold); border-radius:20px; }
    h1 { font-family:'DM Serif Display', Georgia,serif; font-weight:400; font-size:clamp(42px,6vw,78px); line-height:1.11; letter-spacing:-.025em; margin:0 auto 22px; max-width:780px; }
    .description { max-width:540px; margin:0 auto; font-size:clamp(15px,1.6vw,18px); line-height:1.75; color:rgba(255,255,255,.87); }
    .coming { color:var(--gold); font-family:'Allura','Brush Script MT',cursive; font-size:clamp(67px,8.5vw,115px); line-height:1; margin-top:29px; transform:rotate(-3deg); }
    .beta { text-transform:uppercase; letter-spacing:.23em; font-size:12px; font-weight:700; margin-top:7px; }
    footer { text-align:center; padding:0 20px 27px; font-size:12px; color:var(--muted); }
    @keyframes enter { from { opacity:0; transform:translateY(12px) } to {opacity:1; transform:translateY(0)} }
    @media (max-width:650px) { header { padding:23px 25px; } .header-note { display:none; } main { padding:10px 14px 28px; } .hero { min-height:610px; border-radius:19px; padding:66px 23px; } h1 { font-size:clamp(39px,10vw,56px); } .eyebrow { font-size:10px; } .coming { margin-top:38px; } }
    @media (prefers-reduced-motion:reduce) { .inner { animation:none; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">interval<span>.</span></div>
      <div class="header-note">Thoughtful recovery, every day</div>
    </header>
    <main>
      <section class="hero" aria-labelledby="headline">
        <div class="inner">
          <div class="eyebrow">Introducing Interval</div>
          <div class="gold-line" aria-hidden="true"></div>
          <h1 id="headline">Recovery doesn’t stop<br>between appointments.</h1>
          <p class="description">A clinician-guided rehabilitation experience designed to support your recovery, one day at a time.</p>
          <div class="coming">Coming soon</div>
          <div class="beta">Beta in development</div>
        </div>
      </section>
    </main>
    <footer>© 2026 Interval. All rights reserved.</footer>
  </div>
</body>
</html>
